services:
  - type: web
    name: manufacturing-defect-traceability
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 backend.wsgi:app
    healthCheckPath: /api/system/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: defect-traceability-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: defect-traceability-db
    plan: free
    databaseName: defect_traceability
    user: defect_traceability
