version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: defect_traceability_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: defect_traceability
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/exports/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defect_traceability_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DB: defect_traceability
      DATABASE_URL: mysql+pymysql://root:rootpassword@db:3306/defect_traceability?charset=utf8mb4
      PORT: 5000
      CORS_ORIGINS: "*"
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    container_name: defect_traceability_frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8000:80"

volumes:
  mysql_data:
